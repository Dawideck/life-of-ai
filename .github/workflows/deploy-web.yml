name: Deploy web

# Builds web/ and syncs web/dist/ to the VPS.
# Runs only on main (never on pull requests, so code from forks never sees the secrets).
# Requires repository secrets: VPS_HOST, VPS_PORT, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS
# The VPS user is restricted with rrsync to /var/www/lifeofai (docs/runbooks/vps-setup.md).

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Skip if web app does not exist yet
        id: exists
        run: echo "ok=$([ -f web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.exists.outputs.ok == 'true'
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        if: steps.exists.outputs.ok == 'true'
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        if: steps.exists.outputs.ok == 'true'
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync to VPS
        if: steps.exists.outputs.ok == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          # rrsync on the server roots every path at /var/www/lifeofai, so "./" is the site root.
          rsync -rlz --delete --checksum \
            --exclude '.*' --exclude 'runs/' \
            -e "ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o StrictHostKeyChecking=yes" \
            web/dist/ "$VPS_USER@$VPS_HOST:./"

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
