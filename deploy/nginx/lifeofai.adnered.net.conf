# nginx site for lifeofai.adnered.net — static files only.
#
# Template: compare with an existing working site on this VPS (same Cloudflare
# setup) and copy its listen/ssl lines if they differ. Placeholders:
#   <SSL_CERT>, <SSL_KEY>  — certbot or Cloudflare Origin Certificate paths
#
# Install (as root, see docs/runbooks/vps-setup.md):
#   cp lifeofai.adnered.net.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/lifeofai.adnered.net.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name lifeofai.adnered.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;   # nginx < 1.25.1: remove this line and use "listen 443 ssl http2;" instead
    server_name lifeofai.adnered.net;

    ssl_certificate     <SSL_CERT>;
    ssl_certificate_key <SSL_KEY>;

    root /var/www/lifeofai;
    index index.html;

    # The site is static and read-only: no uploads, no forms, no server code.
    client_max_body_size 1k;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Security headers. The viewer reads logs locally via the File API and
    # makes no network requests besides its own files.
    # FVP note: the builder will need connect-src http://localhost:11434 (local Ollama).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/x-ndjson image/svg+xml;

    # Never serve dotfiles (.env, .git, ...) even if one slips into the deploy.
    location ~ /\. { deny all; return 404; }

    # Vite emits content-hashed assets: cache them for a long time.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.jsonl$ {
        default_type application/x-ndjson;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
